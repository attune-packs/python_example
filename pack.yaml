# Python Example Pack
# Demonstrates Python actions, work queues, sensors, triggers, and keystore integration

ref: python_example
label: "Python Example Pack"
description: "Example pack demonstrating Python actions, work queues, a counter sensor with keystore integration, and HTTP requests"
version: "1.0.0"
author: "Attune Team"
email: "support@attune.io"

system: false
enabled: true

# Pack configuration schema (flat format with inline required/secret)
conf_schema:
  counter_key_prefix:
    type: string
    description: "Prefix for counter keys in the keystore"
    default: "python_example.counter"
  queue_batch_size:
    type: integer
    description: "Default batch size for the fulfillment queue example"
    default: 4
  queue_worker_concurrency:
    type: integer
    description: "How many fulfillment queue batches can dispatch in parallel"
    default: 1

# Default pack configuration
config:
  counter_key_prefix: "python_example.counter"
  queue_batch_size: 4
  queue_worker_concurrency: 1

# Pack metadata
meta:
  category: "examples"
  keywords:
    - "python"
    - "examples"
    - "queue"
    - "work-queue"
    - "counter"
    - "sensor"
    - "keystore"
    - "http"
  python_dependencies:
    - "requests>=2.28.0"
    - "pika>=1.3.0"
  documentation_url: "https://github.com/attune-automation/pack-python-example"
  repository_url: "https://github.com/attune-automation/pack-python-example"

# Tags for categorization
tags:
  - python
  - examples
  - queue
  - counter
  - sensor
  - http

# Runtime dependencies
runtime_deps:
  - python3
